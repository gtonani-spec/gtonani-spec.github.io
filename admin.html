<script>
let blocchiCorrenti = [];
function aggiungiBlocco(tipo) {
    blocchiCorrenti.push({ tipo: tipo, sottotitolo: '', testo: '', media: '', tipoMedia: 'image', nuovoFile: null });
    renderBlocchi();
}

function spostaBlocco(idx, dir) {
    const target = idx + dir;
    if (target < 0 || target >= blocchiCorrenti.length) return;
    const temp = blocchiCorrenti[idx];
    blocchiCorrenti[idx] = blocchiCorrenti[target];
    blocchiCorrenti[target] = temp;
    renderBlocchi();
}

function rimuoviBlocco(idx) {
    blocchiCorrenti.splice(idx, 1);
    renderBlocchi();
}

function aggiornaCampoBlocco(idx, campo, valore) {
    blocchiCorrenti[idx][campo] = valore;
}

function selezionaFileBlocco(idx, inputEl) {
    const f = inputEl.files;
    if (f) {
        blocchiCorrenti[idx].nuovoFile = f;
        document.getElementById('blkFileLabel_' + idx).textContent = '✅ Selezionato: ' + f.name;
    }
}

function renderBlocchi() {
    const box = document.getElementById('blocchiContainer');
    if (!box) return;
    if (!blocchiCorrenti.length) {
        box.innerHTML = '<p style="font-size:12px; color:#64748b; text-align:center; padding:8px;">Nessun blocco extra aggiunto.</p>';
        return;
    }
    box.innerHTML = blocchiCorrenti.map((b, idx) => {
        const labelTipo = b.tipo === 'testo' ? 'Blocco Testo' : (b.tipo === 'media' ? 'Blocco Foto / Video' : 'Blocco Foto + Testo');
        let campiHtml = '';
        if (b.tipo === 'testo' || b.tipo === 'affiancato') {
            campiHtml += '<label>Titolo Sezione (Opzionale)</label><input type="text" value="' + (b.sottotitolo || '').replace(/"/g, '&quot;') + '" oninput="aggiornaCampoBlocco(' + idx + ', \'sottotitolo\', this.value)" placeholder="Es. Architettura PLC"><label>Descrizione</label><textarea oninput="aggiornaCampoBlocco(' + idx + ', \'testo\', this.value)" placeholder="Scrivi qui il testo...">' + (b.testo || '') + '</textarea>';
        }
        if (b.tipo === 'media' || b.tipo === 'affiancato') {
            const statoFile = b.nuovoFile ? ('✅ Selezionato: ' + b.nuovoFile.name) : (b.media ? ('📎 Attuale: ' + b.media) : '📷 Tocca per scegliere Foto o Video MP4');
            campiHtml += '<label>Immagine o Video</label><label class="file-upload-box"><input type="file" accept="image/*,video/mp4" onchange="selezionaFileBlocco(' + idx + ', this)"><div class="file-label-text" id="blkFileLabel_' + idx + '">' + statoFile + '</div></label>';
        }
        return '<div class="dynamic-block"><div class="block-header"><span class="block-badge">#' + (idx + 1) + ' // ' + labelTipo + '</span><div class="block-controls"><button type="button" class="btn-mini" onclick="spostaBlocco(' + idx + ', -1)">↑</button><button type="button" class="btn-mini" onclick="spostaBlocco(' + idx + ', 1)">↓</button><button type="button" class="btn-mini del" onclick="rimuoviBlocco(' + idx + ')">✕</button></div></div>' + campiHtml + '</div>';
    }).join('');
}


// ==========================================
// CONFIGURAZIONE GITHUB
// ==========================================

const REPO_OWNER = 'gtonani-spec';
const REPO_NAME = 'gtonani-spec.github.io';
const JSON_FILE = 'progetti.json';

let progettiCache = [];
let jsonSha = '';


// ==========================================
// MESSAGGI
// ==========================================

function mostraToast(msg, isError = false) {
    const t = document.getElementById('toastMsg');

    t.textContent = msg;
    t.style.background = isError ? '#dc2626' : '#16A34A';
    t.style.display = 'block';

    setTimeout(() => {
        t.style.display = 'none';
    }, 4000);
}


// ==========================================
// TOKEN
// ==========================================

function getToken() {
    return localStorage.getItem('automatech_gh_token') || '';
}


function salvaToken() {
    const val = document.getElementById('tokenInput').value.trim();

    if (!val) {
        mostraToast('Inserisci il codice di accesso', true);
        return;
    }

    // Verifica il token prima di salvarlo
    verificaAccesso(val);
}


function esciApp() {
    localStorage.removeItem('automatech_gh_token');
    location.reload();
}


// ==========================================
// VERIFICA ACCESSO
// ==========================================

async function verificaAccesso(tokenDaVerificare = getToken()) {

    if (!tokenDaVerificare) return;

    const btn = document.getElementById('loginBtn');

    if (btn) {
        btn.disabled = true;
        btn.textContent = 'Verifica in corso...';
    }

    try {

        const res = await fetch(
            `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${JSON_FILE}?t=${Date.now()}`,
            {
                headers: {
                    'Authorization': `Bearer ${tokenDaVerificare}`,
                    'Accept': 'application/vnd.github+json'
                }
            }
        );

        if (!res.ok) {
            throw new Error(
                res.status === 401 || res.status === 403
                ? 'Codice non valido oppure permessi insufficienti'
                : 'Impossibile collegarsi al repository GitHub'
            );
        }

        const data = await res.json();

        if (!data.content) {
            throw new Error('Il file progetti.json è vuoto o non leggibile');
        }

        // Token valido: lo salviamo
        localStorage.setItem('automatech_gh_token', tokenDaVerificare);

        // Decodifica JSON GitHub
        const decoded = decodeURIComponent(
            escape(atob(data.content.replace(/\n/g, '')))
        );

        progettiCache = JSON.parse(decoded);
        jsonSha = data.sha;

        // Mostra pannello
        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        document.getElementById('logoutBtn').style.display = 'inline-block';

        renderListaProgetti();

        mostraToast('Accesso effettuato correttamente');

    } catch (e) {

        // Se il token era salvato ma non funziona, rimuovilo
        localStorage.removeItem('automatech_gh_token');

        document.getElementById('loginCard').style.display = 'block';
        document.getElementById('adminPanel').style.display = 'none';

        mostraToast(e.message || 'Errore di accesso GitHub', true);

    } finally {

        if (btn) {
            btn.disabled = false;
            btn.textContent = 'Accedi all\'App';
        }
    }
}


// ==========================================
// CARICAMENTO PROGETTI
// ==========================================

async function caricaProgettiDaGitHub() {
    await verificaAccesso(getToken());
}

function escapeHtml(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

    renderBlocchi();
    }

blocchiCorrenti = [];

// ==========================================
// FILE IN BASE64
// ==========================================

function fileToBase64(file) {

    return new Promise((resolve, reject) => {

        const reader = new FileReader();

        reader.onload = () => {
            resolve(reader.result.split(',')[1]);
        };

        reader.onerror = () => reject(
            new Error('Errore nella lettura del file')
        );

        reader.readAsDataURL(file);
    });
}


// ==========================================
// UPLOAD FOTO / VIDEO SU GITHUB
// ==========================================

async function caricaMediaGitHub(file, token) {

    const ext = file.name.split('.').pop().toLowerCase();

    const mediaName = 'proj_' + Date.now() + '.' + ext;

    const b64 = await fileToBase64(file);

    const url =
        `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${encodeURIComponent(mediaName)}`;

    const upRes = await fetch(url, {

        method: 'PUT',

        headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github+json',
            'Content-Type': 'application/json'
        },

        body: JSON.stringify({
            message: 'Upload media progetto ' + mediaName,
            content: b64
        })
    });

    if (!upRes.ok) {
        const err = await upRes.json().catch(() => ({}));
        throw new Error(err.message || 'Errore caricamento foto/video');
    }

    return {
        media: mediaName,
        tipoMedia: ext === 'mp4' ? 'video' : 'image'
    };
}

async function pubblicaProgetto() {

    const token = getToken();

    if (!token) {
        mostraToast('Devi prima effettuare l accesso', true);
        return;
    }

    const idx = parseInt(
        document.getElementById('editIndex').value
    );

    const codice =
        document.getElementById('pCodice').value.trim()
        || 'PRJ-NEW // AUTOMAZIONE';

    const titolo =
        document.getElementById('pTitolo').value.trim();

    const descrizione =
        document.getElementById('pDesc').value.trim();

    const techRaw =
        document.getElementById('pTech').value.trim();

    const file =
        document.getElementById('pFile').files[0];

    if (!titolo) {
        mostraToast('Inserisci almeno il titolo del progetto', true);
        return;
    }

    const btn = document.getElementById('publishBtn');

    btn.disabled = true;
    btn.textContent = 'Caricamento su GitHub in corso...';

    // Backup per ripristino se il salvataggio fallisce
    const backupCache = [...progettiCache];

    try {

        let mediaName =
            idx >= 0 ? progettiCache[idx].media : 'Robotech.mp4';

        let tipoMedia =
            idx >= 0 ? progettiCache[idx].tipoMedia : 'video';

        // Se è stata scelta una foto o un video
        if (file) {

            const uploaded = await caricaMediaGitHub(file, token);

            mediaName = uploaded.media;
            tipoMedia = uploaded.tipoMedia;
        }

        const nuovoObj = {

            codice: codice,

            titolo: titolo,

            descrizione: descrizione
                || 'Intervento di automazione industriale realizzato da Automatech.',

            media: mediaName,

            tipoMedia: tipoMedia,

            aggiornatoIl: Date.now(),
           
         blocchi: typeof raccogliBlocchi === 'function' ? await raccogliBlocchi(token) : [],


            tecnologie: techRaw
                ? techRaw.split(',').map(s => s.trim()).filter(Boolean)
                : ['Automazione', 'PLC']
        };

        if (idx >= 0) {

            progettiCache[idx] = nuovoObj;

        } else {

            const freeIdx = progettiCache.findIndex(
                p => p.titolo === 'Non ancora aggiunto'
            );

            if (freeIdx !== -1) {
                progettiCache[freeIdx] = nuovoObj;
            } else {
                progettiCache.push(nuovoObj);
            }
        }

        await salvaJsonSuGitHub(
            'Aggiornamento progetti da Automatech App'
        );

        resetForm();
        renderListaProgetti();

        mostraToast('✅ Progetto pubblicato correttamente!');

    } catch (e) {

        // Ripristina i dati in caso di errore
        progettiCache = backupCache;

        renderListaProgetti();

        mostraToast(
            'Errore durante la pubblicazione: ' + e.message,
            true
        );

    } finally {

        btn.disabled = false;
        btn.textContent = 'Pubblica sul Sito';
    }
}

// ==========================================
// AGGIUNGI NUOVO SLOT VUOTO
// ==========================================
async function aggiungiNuovoSlot() {
  const token = getToken();
  if (!token) {
       mostraToast("Devi prima effettuare l'accesso", true);
    return;
  }

  const numeroSlot = progettiCache.length + 1;
  const codiceSlot = 'PRJ-' + String(numeroSlot).padStart(2, '0') + ' // AUTOMAZIONE';

  progettiCache.push({
    codice: codiceSlot,
    titolo: 'Non ancora aggiunto',
    descrizione: 'Intervento di automazione industriale realizzato da Automatech.',
    media: 'videoTest.mp4',
    tipoMedia: 'video',
    aggiornatoIl: Date.now(),
    blocchi: [],
    tecnologie: ['Automazione', 'PLC']
  });

  try {
    await salvaJsonSuGitHub('Aggiunto nuovo slot PRJ-' + String(numeroSlot).padStart(2, '0'));
    renderListaProgetti();
    mostraToast('✅ Slot ' + codiceSlot + ' aggiunto!');
  } catch (e) {
    progettiCache.pop();
    mostraToast('Errore creazione slot: ' + e.message, true);
  }
}



// ==========================================
// ELIMINA PROGETTO
// ==========================================

async function eliminaProgetto(idx) {

    if (!confirm('Vuoi davvero rimuovere questo progetto dal sito?')) {
        return;
    }

    const backupCache = [...progettiCache];

    progettiCache.splice(idx, 1);

    try {

        await salvaJsonSuGitHub(
            'Rimozione progetto da Automatech App'
        );

        renderListaProgetti();

        mostraToast('Progetto rimosso correttamente.');

    } catch (e) {

        progettiCache = backupCache;

        renderListaProgetti();

        mostraToast(
            'Errore durante la rimozione: ' + e.message,
            true
        );
    }
}


// ==========================================
// SALVA JSON SU GITHUB
// ==========================================

async function salvaJsonSuGitHub(commitMsg) {

    const token = getToken();

    const contentEncoded = btoa(
        unescape(
            encodeURIComponent(
                JSON.stringify(progettiCache, null, 2)
            )
        )
    );

    const res = await fetch(
        `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${JSON_FILE}`,
        {
            method: 'PUT',

            headers: {
                'Authorization': `Bearer ${token}`,
                'Accept': 'application/vnd.github+json',
                'Content-Type': 'application/json'
            },

            body: JSON.stringify({
                message: commitMsg,
                content: contentEncoded,
                sha: jsonSha
            })
        }
    );

    if (!res.ok) {

        const err = await res.json().catch(() => ({}));

        throw new Error(
            err.message || 'Errore salvataggio archivio GitHub'
        );
    }

    const updated = await res.json();

    jsonSha = updated.content.sha;
}


// ==========================================
// AVVIO APP
// ==========================================

window.addEventListener('DOMContentLoaded', () => {

    const token = getToken();

    if (token) {
        verificaAccesso(token);
    }

});
